name: music-radar
base: core24
version: '1.1'
summary: Music Recognition app for Linux Desktop
description: |
  Music Radar is a little music recognition app for Linux Desktop, record
  music from your microphone or system to identify the song playing.

grade: stable
confinement: strict
icon: snap/gui/icon.png
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  music-radar:
    command: usr/bin/music-radar
    extensions: [kde-neon-6]
    desktop: usr/share/applications/music-radar.desktop
    environment:
      # The recording pipeline shells out to the bundled parec/lame
      PATH: $SNAP/usr/bin:$SNAP/usr/local/bin:$PATH
    plugs:
      - audio-playback
      - audio-record
      - gsettings
      - home
      - network
      - opengl
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    stage-packages:
      # Recording pipeline: parec (pulseaudio-utils) piped into lame
      - pulseaudio-utils
      - lame
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/music-radar.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/music-radar.desktop
