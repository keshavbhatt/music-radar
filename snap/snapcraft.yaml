name: music-radar
base: core24
version: '1.1'
summary: Music Recognition app for Linux Desktop
description: |
  Music Radar is a little music recognition app for Linux Desktop, record
  music from your microphone or system to identify the song playing.

grade: stable
confinement: strict
icon: snap/gui/icon.png
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  music-radar:
    command: usr/bin/music-radar
    extensions: [kde-neon-6]
    desktop: usr/share/applications/music-radar.desktop
    environment:
      # The recording pipeline shells out to the bundled parec/lame
      PATH: $SNAP/usr/bin:$SNAP/usr/local/bin:$PATH
      # kf6-core24's desktop-launch6 does not register the runtime's GIO
      # modules; without glib-networking, libsoup has no TLS backend and
      # GStreamer fails https streams with "Resource cannot be discovered".
      # Both arch dirs listed (runtime env has no triplet variable); GLib
      # silently skips the one that doesn't exist.
      GIO_EXTRA_MODULES: $SNAP/kf6/usr/lib/x86_64-linux-gnu/gio/modules:$SNAP/kf6/usr/lib/aarch64-linux-gnu/gio/modules
    plugs:
      - audio-playback
      - audio-record
      - gsettings
      - home
      - network
      - opengl
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    build-packages:
      # Gives the linker a resolvable libpulse (the SDK snap's copy has
      # its private libpulsecommon out of the linker's search path) —
      # same convention as the other Qt6::Multimedia snaps (glate-ng,
      # ArrowEscape, HungrySnake, TypingMaster).
      - libpulse-dev
    stage-packages:
      # Recording pipeline: parec (pulseaudio-utils) piped into lame
      - pulseaudio-utils
      - lame
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/music-radar.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/music-radar.desktop
